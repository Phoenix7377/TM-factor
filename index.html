<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>TM Factor</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
    .app { width: 100%; max-width: 420px; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .card { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem; margin-bottom: 14px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--accent); color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .result { text-align: center; padding: 10px 0; display: none; }
    .score { font-size: 2.6rem; font-weight: 800; margin: 6px 0; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; }
    .breakdown { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="app">
    <h1>TM Factor</h1>
    <div class="sub">Convert money &amp; time into total Life Hours</div>
    <div class="card">
      <label for="rate">Your Hourly Value ($/hr)</label>
      <input type="number" id="rate" value="20" min="1" step="0.5" />
    </div>
    <div class="card">
      <label for="money">Money Spent ($)</label>
      <input type="number" id="money" placeholder="e.g. 40" min="0" step="0.01" />
      <div class="row">
        <div>
          <label for="time">Time Spent</label>
          <input type="number" id="time" placeholder="e.g. 1.5" min="0" step="0.1" />
        </div>
        <div>
          <label for="unit">Unit</label>
          <select id="unit">
            <option value="hours">Hours</option>
            <option value="minutes">Minutes</option>
          </select>
        </div>
      </div>
      <button onclick="calculateTM()">Calculate TM Factor</button>
    </div>
    <div class="card result" id="outputCard">
      <div class="badge" id="tierBadge">Low Cost</div>
      <div class="score" id="tmScore">0.00 TM</div>
      <div class="breakdown" id="breakdownText"></div>
    </div>
  </div>
  <script>
    const rateInput = document.getElementById('rate');
    rateInput.value = localStorage.getItem('tm_rate') || 20;
    rateInput.addEventListener('change', () => localStorage.setItem('tm_rate', rateInput.value));
    function calculateTM() {
      const rate = parseFloat(rateInput.value) || 20;
      const money = parseFloat(document.getElementById('money').value) || 0;
      let time = parseFloat(document.getElementById('time').value) || 0;
      if (document.getElementById('unit').value === 'minutes') time = time / 60;
      const moneyHours = money / rate;
      const tmFactor = moneyHours + time;
      document.getElementById('outputCard').style.display = 'block';
      document.getElementById('tmScore').textContent = tmFactor.toFixed(2) + ' TM';
      document.getElementById('breakdownText').textContent = `${moneyHours.toFixed(2)} hrs of money + ${time.toFixed(2)} hrs of time`;
      const badge = document.getElementById('tierBadge');
      if (tmFactor <= 1) { badge.textContent = 'Low Friction'; badge.style.background = '#22c55e33'; badge.style.color = '#22c55e'; }
      else if (tmFactor <= 5) { badge.textContent = 'Moderate Cost'; badge.style.background = '#f59e0b33'; badge.style.color = '#f59e0b'; }
      else { badge.textContent = 'High Life-Hour Cost'; badge.style.background = '#ef444433'; badge.style.color = '#ef4444'; }
    }
  </script>
</body>
</html>
